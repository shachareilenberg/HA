# ── Config-update automations ─────────────────────────────────────────────────

- id: '1773300000001'
  alias: Config Update — Pull from GitHub every 5 min
  description: >
    Runs ha-pull.sh every 5 minutes. If new commits were pulled, forces an
    immediate binary_sensor rescan and sends an actionable push notification
    to the iPad asking the user to approve a restart.
    ── SETUP ──────────────────────────────────────────────────────────────
    Replace IPAD_NOTIFY_ENTITY below with your iPad's notify entity.
    Find it: Settings → Devices & Services → Companion App → your iPad
    → the notify service is usually notify.mobile_app_<device_name>
  triggers:
  - trigger: time_pattern
    minutes: "/5"
  conditions: []
  actions:
  - action: shell_command.ha_pull_config
  - delay: "00:00:02"
  - action: homeassistant.update_entity
    target:
      entity_id: binary_sensor.config_update_available
  - condition: state
    entity: binary_sensor.config_update_available
    state: 'on'
  - action: notify.mobile_app_ipad_2
    data:
      title: "Config Update Available"
      message: "New configuration pulled from GitHub. Restart Home Assistant to apply?"
      data:
        push:
          sound: default
        actions:
          - action: "RESTART_HA"
            title: "Restart HA"
            destructive: true
          - action: "DISMISS_UPDATE"
            title: "Later"
  mode: single

- id: '1773300000003'
  alias: Config Update — Auto push to GitHub every 5 min
  description: >
    Runs ha-push.sh on the HA device every 5 minutes. Commits and pushes any
    local changes (from HA UI editors, File Editor, SSH edits, etc.) so the
    config on GitHub always stays in sync with the device.
  triggers:
  - trigger: time_pattern
    minutes: "/5"
  conditions: []
  actions:
  - action: shell_command.ha_push_config
  mode: single

- id: '1773300000002'
  alias: Config Update — Restart HA on iPad approval
  description: >
    Fires when the user taps "Restart HA" in the push notification.
    Restarts Home Assistant immediately.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: RESTART_HA
  conditions: []
  actions:
  - action: homeassistant.restart
  mode: single

- id: '1773300000005'
  alias: Config Update — Dismiss on "Later"
  description: >
    Fires when the user taps "Later" in the push notification.
    Clears the signal file so the dashboard banner disappears
    without restarting HA.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: DISMISS_UPDATE
  conditions: []
  actions:
  - action: shell_command.clear_update_flag
  - action: homeassistant.update_entity
    target:
      entity_id: binary_sensor.config_update_available
  mode: single

- id: '1773300000004'
  alias: Config Update — Clear flag after HA restarts
  description: >
    Runs once HA finishes starting after a restart. Removes the signal file
    so the dashboard banner disappears automatically.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: shell_command.clear_update_flag
  mode: single

# ─────────────────────────────────────────────────────────────────────────────

- id: '1773200000001'
  alias: iPad — Navigate to iPad Dashboard on Connect
  description: >
    Redirects the registered iPad browser to the iPad landscape dashboard
    (/ui-ipad) whenever it connects. Replace REPLACE_WITH_IPAD_BROWSER_ID
    with the UUID shown in the browser_mod panel on the iPad.
  triggers:
  - trigger: event
    event_type: browser_mod_connected
    event_data:
      browser_id: REPLACE_WITH_IPAD_BROWSER_ID
  conditions: []
  actions:
  - delay: '00:00:01'
  - action: browser_mod.navigate
    data:
      browser_id: REPLACE_WITH_IPAD_BROWSER_ID
      path: /ui-ipad
  mode: single
