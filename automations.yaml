- id: '1771367668126'
  alias: Confirm HVAC Mode Sync (Kichen 1 relay)
  triggers:
  - entity_id:
    - climate.l8_102
    - climate.l8_103
    - climate.l8_104
    - climate.l8_105
    trigger: state
  conditions:
  - condition: template
    value_template: "{{\n  requested_mode in ['heat','cool']\n  and trigger.from_state
      is not none\n  and requested_mode != trigger.from_state.state\n  and is_state('climate.l8_101',
      'off')\n  and requested_mode != last_mode\n}}\n"
  actions:
  - data:
      title: HVAC mode change needs confirmation
      message: '{{ trigger.to_state.name }} set to {{ requested_mode|upper }} while
        Kitchen 1 relay is OFF. Turned-on climates: {{ turned_on_pretty if turned_on_pretty
        else ''none'' }}. What do you want to do?

        '
      data:
        tag: hvac_mode_confirm
        actions:
        - action: HVAC_SYNC
          title: Sync (enable {{ requested_mode|upper }})
        - action: HVAC_TURN_OFF_AND_SYNC
          title: Turn them off + Sync
        - action: HVAC_ABORT
          title: Abort
    action: notify.mobile_app_shachars_iphone
  - wait_for_trigger:
    - event_type: mobile_app_notification_action
      event_data:
        action: HVAC_SYNC
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: HVAC_TURN_OFF_AND_SYNC
      trigger: event
    - event_type: mobile_app_notification_action
      event_data:
        action: HVAC_ABORT
      trigger: event
    timeout: 00:01:00
    continue_on_timeout: false
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''HVAC_SYNC'' }}'
      sequence:
      - target:
          entity_id: climate.l8_101
        data:
          hvac_mode: '{{ requested_mode }}'
        action: climate.set_hvac_mode
      - delay: 00:00:02
      - target:
          entity_id: climate.l8_101
        action: climate.turn_off
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''HVAC_TURN_OFF_AND_SYNC''
          }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ turned_on_climates | count > 0 }}'
        then:
        - target:
            entity_id: '{{ turned_on_climates }}'
          action: climate.turn_off
        - delay: 00:00:01
      - target:
          entity_id: climate.l8_101
        data:
          hvac_mode: '{{ requested_mode }}'
        action: climate.set_hvac_mode
      - delay: 00:00:02
      - target:
          entity_id: climate.l8_101
        action: climate.turn_off
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''HVAC_ABORT'' }}'
      sequence: []
  mode: queued
  max: 10
  variables:
    requested_mode: '{{ trigger.to_state.state }}'
    last_mode: '{{ states(''input_select.kitchen_1_last_mode'') }}'
    all_climates:
    - climate.l8_102
    - climate.l8_103
    - climate.l8_104
    - climate.l8_105
    turned_on_climates: '{{ expand(all_climates) | selectattr(''state'',''ne'',''off'')
      | map(attribute=''entity_id'') | list }}

      '
    turned_on_pretty: "{{ expand(all_climates) | selectattr('state','ne','off')\n
      \  | map(attribute='name') | list | join(', ') }}\n"
- id: '1772529828443'
  alias: 'Oref: Pre-Alert Notification'
  description: Announce red alert on Alexa if before 19:30 with high volume
  triggers:
  - entity_id:
    - sensor.oref_alert
    trigger: state
    to:
    - pre_alert
  conditions: []
  actions:
  - variables:
      current_vol: '{{ state_attr(''media_player.kitchen_s_echo'', ''volume_level'')
        | default(0.5, true) }}'
  - if:
    - condition: time
      before: '19:30:00'
    then:
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen_s_echo
      data:
        volume_level: 0.4
    else:
    - action: media_player.volume_set
      target:
        entity_id: media_player.kitchen_s_echo
      data:
        volume_level: 0.2
  - action: notify.alexa_media
    data:
      target: media_player.kitchen_s_echo
      data:
        type: tts
      message: Warning. Red alert detected. Please move to the protected area immediately.
  - action: notify.mobile_app_shachars_iphone
    metadata: {}
    data:
      message: In a few minutes, there will probably be a siren.
      title: "\U0001F6A8 Pre alert"
  - delay: 00:00:08
  - action: media_player.volume_set
    target:
      entity_id: media_player.kitchen_s_echo
    data:
      volume_level: '{{ current_vol }}'
  mode: single
- id: '1772535520807'
  alias: 'Oref: Alert Ended Notification'
  description: 'Notify when the alert ends only if the flow was either: alert -> ok
    or alert -> pre_alert -> ok'
  triggers:
  - trigger: state
    entity_id: sensor.oref_alert
    to: ok
  conditions:
  - condition: state
    entity_id: input_boolean.oref_alert_was_active
    state: 'on'
  actions:
  - action: notify.mobile_app_shachars_iphone
    data:
      title: Red alert end
      message: It is safe to get out of the shelter.
  - if:
    - condition: time
      before: '19:30:00'
    then:
    - variables:
        current_vol: '{{ state_attr(''media_player.bedroom_echo_spot'', ''volume_level'')
          | default(0.5, true) }}'
    - action: media_player.volume_set
      target:
        entity_id: media_player.bedroom_echo_spot
      data:
        volume_level: 0.3
    - action: notify.alexa_media
      data:
        target: media_player.bedroom_echo_spot
        data:
          type: tts
        message: The alert has ended. You may leave the protected area.
    - delay: 00:00:06
    - action: media_player.volume_set
      target:
        entity_id: media_player.bedroom_echo_spot
      data:
        volume_level: '{{ current_vol }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.oref_alert_was_active
  mode: single
- id: '1772606072371'
  alias: 'Oref alert: Intercepted notification'
  description: 'Announce threat intercepted on Alexa + Shachar’s iPhone only if the
    previous state was Pre Alert and now its Ok (restore previous Alexa volume afterwards).

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.oref_alert
    from:
    - pre_alert
    to:
    - ok
  conditions: []
  actions:
  - variables:
      current_vol: "{{ state_attr('media_player.kitchen_s_echo', 'volume_level')\n
        \  | default(0.5, true) }}"
  - action: notify.mobile_app_shachars_iphone
    data:
      title: Red alert canceled
      message: Threat intercepted
  - action: media_player.volume_set
    target:
      entity_id: media_player.kitchen_s_echo
    data:
      volume_level: 0.4
  - action: notify.alexa_media
    data:
      target: media_player.kitchen_s_echo
      data:
        type: tts
      message: 'The red alert has been canceled. The threat was intercepted. '
  - delay: 00:00:06
  - action: media_player.volume_set
    target:
      entity_id: media_player.kitchen_s_echo
    data:
      volume_level: '{{ current_vol }}'
  mode: single
- id: '1773147979600'
  alias: 'Oref: Track Alert Active'
  description: Turn on flag when Oref enters alert state
  triggers:
  - trigger: state
    entity_id: sensor.oref_alert
    to: alert
  conditions: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.oref_alert_was_active
  mode: single

# ── iPad Default Dashboard ────────────────────────────────────────────────────
# This automation navigates the registered iPad browser to /ui-ipad every time
# it connects to Home Assistant.
#
# HOW TO GET YOUR IPAD BROWSER ID:
#   1. Open HA on the iPad and go to Settings → browser_mod (or the browser_mod
#      popup in Developer Tools).
#   2. Enable "Register" for the iPad browser — note the Browser ID (a UUID).
#   3. Replace REPLACE_WITH_IPAD_BROWSER_ID below (both occurrences) with that UUID.
#   4. Reload automations (Developer Tools → YAML → Reload Automations).
# ─────────────────────────────────────────────────────────────────────────────
# ── SUGGESTED AUTOMATIONS ────────────────────────────────────────────────────
# Uncomment and customise the blocks below to activate.
#
# ── Movie Mode ───────────────────────────────────────────────────────────────
# Turns off kitchen + living room lights, closes living room blinds, and
# switches the Samsung TV audio source to the Yamaha receiver.
#
# TV entity: media_player.tv · Yamaha source: RX-V6A (already configured)
#
