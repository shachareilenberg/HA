
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Register the iPad YAML dashboard alongside the default UI-managed dashboards.
# The main lovelace stays in storage mode (UI editor works normally).
# Visit /ui-ipad on the iPad after restarting HA.
lovelace:
  mode: storage
  dashboards:
    ui-ipad:
      mode: yaml
      title: iPad Home
      icon: mdi:tablet
      show_in_sidebar: true
      filename: ui-ipad-dashboard.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ── Config-update detection ───────────────────────────────────────────────────
# check-updates.sh (run every 5 min via launchd) touches /tmp/ha-config-updated
# after a successful git pull. The binary sensor below watches for that file so
# the dashboard can show an "update available / restart HA" banner.
command_line:
  - binary_sensor:
      name: "Config Update Available"
      unique_id: config_update_available
      command: "test -f /tmp/ha-config-updated && echo 1 || echo 0"
      payload_on: "1"
      payload_off: "0"
      scan_interval: 30

# Clears the signal file once the user has restarted HA.
shell_command:
  clear_update_flag: "rm -f /tmp/ha-config-updated"
