
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Register the iPad YAML dashboard alongside the default UI-managed dashboards.
# The main lovelace stays in storage mode (UI editor works normally).
# Visit /ui-ipad on the iPad after restarting HA.
lovelace:
  mode: storage
  dashboards:
    ui-ipad:
      mode: yaml
      title: iPad Home
      icon: mdi:tablet
      show_in_sidebar: true
      filename: ui-ipad-dashboard.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ── Config-update detection ───────────────────────────────────────────────────
# check-updates.sh (Mac, every 5 min via launchd) calls the webhook
# "ha-config-updated" after a successful git pull. The automation in
# automations.yaml receives that webhook and turns this helper on, which
# makes the dashboard banner visible. It resets automatically on HA restart.
input_boolean:
  config_update_available:
    name: Config Update Available
    icon: mdi:update

# Optional: pull the latest config directly on the HA device.
# Requires git to be available in the HA shell environment
# (e.g. via the "Advanced SSH & Web Terminal" add-on).
# Call this service from Developer Tools → Services to test.
shell_command:
  git_pull_config: "git -C /config pull --ff-only --quiet 2>&1"
