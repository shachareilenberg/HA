
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Register the iPad YAML dashboard alongside the default UI-managed dashboards.
# The main lovelace stays in storage mode (UI editor works normally).
# Visit /ui-ipad on the iPad after restarting HA.
lovelace:
  mode: storage
  dashboards:
    ui-ipad:
      mode: yaml
      title: iPad Home
      icon: mdi:tablet
      show_in_sidebar: true
      filename: ui-ipad-dashboard.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ── Config-update detection ───────────────────────────────────────────────────
# ha-pull.sh writes /config/.ha-update-flag on a successful pull.
# Storing the flag inside /config/ ensures it survives container reboots.
# ha-git.log (also in /config/) records all git operations — readable via
# the File Editor add-on when diagnosing problems.
command_line:
  - binary_sensor:
      name: "Config Update Available"
      unique_id: config_update_available
      command: "test -f /config/.ha-update-flag && echo 1 || echo 0"
      payload_on: "1"
      payload_off: "0"
      scan_interval: 30

  - sensor:
      name: "Git Sync Status"
      unique_id: git_sync_status
      command: >-
        cd /config 2>/dev/null && test -d .git &&
        echo "repo_ok:$(git rev-list HEAD..origin/$(git branch --show-current) --count 2>/dev/null || echo ?)_behind:$(git status --porcelain 2>/dev/null | wc -l | tr -d ' ')_local" ||
        echo "no_repo"
      scan_interval: 300

shell_command:
  ha_pull_config: "bash /config/ha-pull.sh"
  ha_push_config: "bash /config/ha-push.sh"
  clear_update_flag: "rm -f /config/.ha-update-flag"
