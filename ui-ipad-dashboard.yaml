##############################################################
# iPad Landscape Dashboard — ui-ipad-dashboard.yaml
# v2
#
# HOW TO REGISTER:
#   Settings → Dashboards → Add Dashboard
#   Title: iPad Home  |  Icon: mdi:tablet  |  URL: /ui-ipad
#   Mode: YAML  →  point to this file path
#
# ── REQUIRED HACS FRONTEND CARDS (all pre-installed) ──────
#  ✓ lovelace-mushroom        (Mushroom Cards v5+)
#  ✓ lovelace-card-mod        (CSS overrides)
#  ✓ lovelace-layout-card     (Grid Layout engine)
#  ✓ browser_mod              (Smart popups v2+)
#  ✓ clock-weather-card       (Sidebar clock + weather)
#
# ── SAMSUNG TV NOTE ────────────────────────────────────────
#  TV entity: media_player.tv_2
#  Yamaha receiver source name: RX-V6A
#  D-pad navigation (send_key) requires the SamsungTV or
#  SamsungTV-Tizen integration (not SmartThings alone).
#  HACS: "SamsungTV Smart" adds full remote + app control.
#
# ── THEME ──────────────────────────────────────────────────
#  "Frosted Glass Dark" — installed in themes/
#  Provides automatic glassmorphism on all ha-card elements
##############################################################

title: iPad

views:
  - title: Home
    path: home
    theme: "Frosted Glass Dark"
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: "280px minmax(0, 1fr)"
          grid-template-areas: |
            "sidebar main"
          grid-gap: "10px"
          padding: "10px"

        cards:

          # ╔═══════════════════════════════╗
          # ║           SIDEBAR             ║
          # ╚═══════════════════════════════╝
          - view_layout:
              grid-area: sidebar
            type: vertical-stack
            cards:

              # ── Clock + Weather ──────────────────
              # If weather.forecast_home shows an error, try weather.home
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                time_format: 24
                animated_icon: true
                forecast_rows: 3

              # ── Presence ─────────────────────────
              - type: custom:mushroom-title-card
                title: Presence
                card_mod:
                  style: |
                    ha-card { margin-top: 4px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-person-card
                    entity: person.shachar
                    name: Shachar
                    layout: vertical
                    fill_container: true
                  - type: custom:mushroom-person-card
                    entity: person.ariel
                    name: Ariel
                    layout: vertical
                    fill_container: true

              # ── Routines ─────────────────────────
              - type: custom:mushroom-title-card
                title: Routines
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Good Night
                    secondary: Routine
                    icon: mdi:weather-night
                    icon_color: indigo
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_night_event
                  - type: custom:mushroom-template-card
                    primary: Good Morning
                    secondary: Routine
                    icon: mdi:weather-sunny
                    icon_color: amber
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_morning_event

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Exit Home
                    secondary: Away
                    icon: mdi:exit-run
                    icon_color: orange
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.exit_home_event
                  - type: custom:mushroom-template-card
                    primary: Welcome Home
                    secondary: Arrival
                    icon: mdi:home-import-outline
                    icon_color: green
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.welcome_home_event_trigger

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Lights Off
                    secondary: All
                    icon: mdi:lightbulb-off-outline
                    icon_color: yellow
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.turn_off_all_lights_v2
                  - type: custom:mushroom-template-card
                    primary: Close Blinds
                    secondary: All
                    icon: mdi:blinds
                    icon_color: blue
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.close_all_blinds

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: ACs Off
                    secondary: All Units
                    icon: mdi:air-conditioner
                    icon_color: blue-grey
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.1766497466499
                  - type: custom:mushroom-template-card
                    entity: cover.4g600204913
                    primary: Garage Gate
                    secondary: >
                      {{ 'Open' if is_state('cover.4g600204913', 'open') else 'Closed' }}
                    icon: mdi:garage
                    icon_color: >
                      {{ 'green' if is_state('cover.4g600204913', 'open') else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: more-info

              # ── Good Night Mode State ─────────────
              - type: custom:mushroom-entity-card
                entity: input_boolean.good_night_state
                name: Good Night Mode
                icon: mdi:sleep
                icon_color: indigo
                toggle: true
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # ── Git Sync ──────────────────────────
              # Manual pull / push — use when automated sync isn't working.
              # Check /config/ha-git.log in File Editor to diagnose errors.
              - type: custom:mushroom-title-card
                title: Git Sync
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # Status badge — shows git_not_found / not_a_repo / ok:branch
              - type: custom:mushroom-template-card
                primary: >
                  {% set s = states('sensor.git_setup_status') %}
                  {% if s == 'git_not_found' %}Git not found
                  {% elif s == 'not_a_repo' %}Run ha-git-setup.sh
                  {% elif s.startswith('ok:') %}Branch: {{ s[3:] | trim }}
                  {% else %}{{ s }}
                  {% endif %}
                secondary: Git status
                icon: >
                  {% set s = states('sensor.git_setup_status') %}
                  {% if s.startswith('ok:') %}mdi:source-branch-check
                  {% else %}mdi:alert-circle-outline
                  {% endif %}
                icon_color: >
                  {% set s = states('sensor.git_setup_status') %}
                  {% if s.startswith('ok:') %}green{% else %}red{% endif %}
                layout: horizontal
                fill_container: true

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Pull
                    secondary: Check & pull
                    icon: mdi:cloud-download-outline
                    icon_color: blue
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: perform-action
                      perform_action: shell_command.ha_pull_config
                  - type: custom:mushroom-template-card
                    primary: Push
                    secondary: Commit & push
                    icon: mdi:cloud-upload-outline
                    icon_color: green
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: perform-action
                      perform_action: shell_command.ha_push_config

              # ── Apps ──────────────────────────────
              # Tapping opens the baby monitor app via an iOS Shortcut.
              # Setup: on the iPad, create a Shortcut named exactly
              # "Baby Monitor+" with one action: Open App → Philips Baby Monitor+
              - type: custom:mushroom-title-card
                title: Apps
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: custom:mushroom-template-card
                primary: Baby Monitor
                secondary: Philips Avent
                icon: mdi:baby-face-outline
                icon_color: pink
                layout: vertical
                fill_container: true
                tap_action:
                  action: url
                  url_path: "shortcuts://x-callback-url/run-shortcut?name=Baby%20Monitor"


          # ╔═══════════════════════════════╗
          # ║          MAIN AREA            ║
          # ╚═══════════════════════════════╝
          - view_layout:
              grid-area: main
            type: vertical-stack
            cards:

              # ── UPDATE BANNER (hidden until a git pull delivers new commits) ──
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.config_update_available
                    state: 'on'
                card:
                  type: custom:mushroom-template-card
                  primary: Config Update Available
                  secondary: Check your iPad notification to approve restart · Hold to dismiss
                  icon: mdi:update
                  icon_color: amber
                  fill_container: true
                  tap_action:
                    action: perform-action
                    perform_action: homeassistant.restart
                  hold_action:
                    action: perform-action
                    perform_action: shell_command.clear_update_flag
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid rgba(255,180,0,0.6) !important;
                        background: rgba(255,180,0,0.12) !important;
                        margin-bottom: 6px !important;
                      }

              # ── STATUS BAR ────────────────────────
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}Red Alert Active!{% elif s == 'pre_alert' %}Pre-Alert Warning{% else %}Area Secure{% endif %}
                    secondary: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}Seek shelter now{% elif s == 'pre_alert' %}Prepare for alert{% else %}No active alerts{% endif %}
                    icon: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s in ['alert', 'pre_alert'] %}mdi:alert-circle{% else %}mdi:shield-check{% endif %}
                    icon_color: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}red{% elif s == 'pre_alert' %}orange{% else %}green{% endif %}
                    fill_container: true
                    tap_action:
                      action: more-info
                      entity: sensor.oref_alert

                  - type: custom:mushroom-entity-card
                    entity: input_boolean.is_away_state
                    name: Away Mode
                    icon: mdi:home-lock
                    toggle: true
                    fill_container: true

                  - type: custom:mushroom-number-card
                    entity: number.mqlkht_dvd_countdown
                    name: Boiler Timer
                    icon: mdi:water-boiler
                    icon_color: deep-orange
                    display_mode: slider
                    fill_container: true


              # ══════════════════════════════════════
              # ROOM OVERVIEW
              # Tap any card to navigate to the room tab.
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Rooms
                subtitle: Tap to manage
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # Row 1: Living Room & Kitchen | Office
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Living Room & Kitchen
                    secondary: >
                      {% set ac1 = states('climate.l8_101') %}
                      {% set ac2 = states('climate.l8_102') %}
                      {% set lights = [
                        states('light.slvn_slvn_spvtym'),
                        states('light.slvn_slvn_qyr'),
                        states('light.mtbkh_mtbkh_ps'),
                        states('light.mtbkh_mtbkh_qyr'),
                        states('light.mtbkh_mtbkh_shvlkhn'),
                        states('light.knysh_na'),
                        states('light.mtbkh_mtbkh_y')
                      ] %}
                      {% set lights_on = lights | select('eq','on') | list | count %}
                      {% set ac_on = [ac1,ac2] | select('ne','off') | list %}
                      {% if ac_on | count > 0 %}AC {{ ac_on[0] | title }}{% else %}AC Off{% endif %} · {{ lights_on }} light{{ 's' if lights_on != 1 }}
                    icon: mdi:sofa
                    icon_color: >
                      {% set ac1 = states('climate.l8_101') %}
                      {% set ac2 = states('climate.l8_102') %}
                      {% set lights = [
                        states('light.slvn_slvn_spvtym'),
                        states('light.slvn_slvn_qyr'),
                        states('light.mtbkh_mtbkh_ps'),
                        states('light.mtbkh_mtbkh_qyr'),
                        states('light.mtbkh_mtbkh_shvlkhn'),
                        states('light.knysh_na'),
                        states('light.mtbkh_mtbkh_y')
                      ] %}
                      {% if [ac1,ac2] | select('ne','off') | list | count > 0 or lights | select('eq','on') | list | count > 0 %}orange{% else %}grey{% endif %}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/living-kitchen

                  - type: custom:mushroom-template-card
                    primary: Office
                    secondary: >
                      {% set ac = states('climate.l8_103') %}
                      {% set lights = [
                        states('light.mshrd_mshrd_tqrh'),
                        states('light.mshrd_mshrd_qyr_khlvn'),
                        states('light.mshrd_mshrd_qyr')
                      ] %}
                      {% set lights_on = lights | select('eq','on') | list | count %}
                      {% if ac != 'off' %}AC {{ ac | title }}{% else %}AC Off{% endif %} · {{ lights_on }} light{{ 's' if lights_on != 1 }}
                    icon: mdi:desk
                    icon_color: >
                      {% set ac = states('climate.l8_103') %}
                      {% set lights = [
                        states('light.mshrd_mshrd_tqrh'),
                        states('light.mshrd_mshrd_qyr_khlvn'),
                        states('light.mshrd_mshrd_qyr')
                      ] %}
                      {% if ac != 'off' or lights | select('eq','on') | list | count > 0 %}blue{% else %}grey{% endif %}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/office

              # Row 2: Kids | Bedroom
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Kids Room
                    secondary: >
                      {% set ac = states('climate.l8_104') %}
                      {% set lights = [
                        states('light.mm_d_mm_d_tqrh'),
                        states('light.mqlkht_mqlkht_qyr'),
                        states('light.mqlkht_mqlkht_tvrt_lylh'),
                        states('light.mqlkht_mqlkht_spvtym')
                      ] %}
                      {% set lights_on = lights | select('eq','on') | list | count %}
                      {% if ac != 'off' %}AC {{ ac | title }}{% else %}AC Off{% endif %} · {{ lights_on }} light{{ 's' if lights_on != 1 }}
                    icon: mdi:bed-double
                    icon_color: >
                      {% set ac = states('climate.l8_104') %}
                      {% set lights = [
                        states('light.mm_d_mm_d_tqrh'),
                        states('light.mqlkht_mqlkht_qyr'),
                        states('light.mqlkht_mqlkht_tvrt_lylh'),
                        states('light.mqlkht_mqlkht_spvtym')
                      ] %}
                      {% if ac != 'off' or lights | select('eq','on') | list | count > 0 %}purple{% else %}grey{% endif %}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/kids

                  - type: custom:mushroom-template-card
                    primary: Bedroom
                    secondary: >
                      {% set ac = states('climate.l8_105') %}
                      {% set lights = [
                        states('light.hvrym_hvrym_spvtym'),
                        states('light.hvrym_hvrym_knysh'),
                        states('light.hvrym_hvrym_qryh_ymyn'),
                        states('light.hvrym_hvrym_qryh_shml'),
                        states('light.hvrym_hvrym_mqlkht_qyr_2'),
                        states('light.hvrym_hvrym_mqlkht_qyr_1'),
                        states('light.hvrym_hvrym_mqlkht_spvtym')
                      ] %}
                      {% set lights_on = lights | select('eq','on') | list | count %}
                      {% if ac != 'off' %}AC {{ ac | title }}{% else %}AC Off{% endif %} · {{ lights_on }} light{{ 's' if lights_on != 1 }}
                    icon: mdi:bed-king
                    icon_color: >
                      {% set ac = states('climate.l8_105') %}
                      {% set lights = [
                        states('light.hvrym_hvrym_spvtym'),
                        states('light.hvrym_hvrym_knysh'),
                        states('light.hvrym_hvrym_qryh_ymyn'),
                        states('light.hvrym_hvrym_qryh_shml'),
                        states('light.hvrym_hvrym_mqlkht_qyr_2'),
                        states('light.hvrym_hvrym_mqlkht_qyr_1'),
                        states('light.hvrym_hvrym_mqlkht_spvtym')
                      ] %}
                      {% if ac != 'off' or lights | select('eq','on') | list | count > 0 %}indigo{% else %}grey{% endif %}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/bedroom

              # Row 3: Common Areas (full width)
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Common Areas
                    secondary: >
                      {% set lights = [
                        states('light.knysh_knysh_qyr'),
                        states('light.knysh_knysh_tvrh'),
                        states('light.msdrvn_msdrvn_ps'),
                        states('light.msdrvn_msdrvn_tvrt_lylh'),
                        states('light.mrpst_mrpst_qyr'),
                        states('light.mrpst_mrpst_tqrh')
                      ] %}
                      {% set lights_on = lights | select('eq','on') | list | count %}
                      Entrance · Hallway · Balcony · {{ lights_on }} light{{ 's' if lights_on != 1 }} on
                    icon: mdi:home-floor-1
                    icon_color: >
                      {% set lights = [
                        states('light.knysh_knysh_qyr'),
                        states('light.knysh_knysh_tvrh'),
                        states('light.msdrvn_msdrvn_ps'),
                        states('light.msdrvn_msdrvn_tvrt_lylh'),
                        states('light.mrpst_mrpst_qyr'),
                        states('light.mrpst_mrpst_tqrh')
                      ] %}
                      {% if lights | select('eq','on') | list | count > 0 %}green{% else %}grey{% endif %}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/common

  # ╔══════════════════════════════════════════════════════════════╗
  # ║              ROOM TABS  (subview: true = hidden from nav)    ║
  # ╚══════════════════════════════════════════════════════════════╝

  # ── Living Room & Kitchen ──────────────────────────────────────
  - title: Living Room & Kitchen
    path: living-kitchen
    subview: true
    theme: "Frosted Glass Dark"
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: "1fr"
          padding: "10px"
        cards:
          - type: vertical-stack
            cards:

              # ── Back navigation ───────────────────
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Back
                    icon: mdi:arrow-left
                    icon_color: grey
                    layout: horizontal
                    fill_container: false
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/home
                    card_mod:
                      style: |
                        ha-card { max-width: 120px; }
                  - type: custom:mushroom-title-card
                    title: Living Room & Kitchen
                    fill_container: true

              # ── Climate ───────────────────────────
              - type: custom:mushroom-title-card
                title: Climate
                subtitle: Air Conditioning
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-climate-card
                    entity: climate.l8_101
                    name: Kitchen 1
                    hvac_modes:
                      - "off"
                      - cool
                      - heat
                      - fan_only
                      - dry
                    show_temperature_control: true
                    fill_container: true
                  - type: custom:mushroom-climate-card
                    entity: climate.l8_102
                    name: Kitchen 2
                    hvac_modes:
                      - "off"
                      - cool
                      - heat
                      - fan_only
                      - dry
                    show_temperature_control: true
                    fill_container: true

              # ── Lighting ──────────────────────────
              - type: custom:mushroom-title-card
                title: Lighting
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: custom:mushroom-title-card
                title: Living Room
                card_mod:
                  style: |
                    ha-card { margin-top: 4px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.slvn_slvn_spvtym
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.slvn_slvn_qyr
                    fill_container: true
                    tap_action:
                      action: toggle

              - type: custom:mushroom-title-card
                title: Kitchen
                card_mod:
                  style: |
                    ha-card { margin-top: 4px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_ps
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_qyr
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_shvlkhn
                    fill_container: true
                    tap_action:
                      action: toggle

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.knysh_na
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_y
                    fill_container: true
                    tap_action:
                      action: toggle

              # ── Blinds ────────────────────────────
              - type: custom:mushroom-title-card
                title: Blinds
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-cover-card
                    entity: cover.slvn_slvn_trys
                    name: Living Room
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-cover-card
                    entity: cover.slvn_slvn_trys_khlvn
                    name: Living Room (small)
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-cover-card
                    entity: cover.mtbkh_mtbkh_trys
                    name: Kitchen
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

              # ── Fan ───────────────────────────────
              - type: custom:mushroom-title-card
                title: Fan
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: fan.slvn_slvn_tqrh
                    name: Living Room Fan
                    icon: mdi:fan
                    icon_color: cyan
                    toggle: true
                    fill_container: true

              # ── Media & Entertainment ─────────────
              - type: custom:mushroom-title-card
                title: Media
                subtitle: Alexa · TV · Yamaha RX-V6A
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-media-player-card
                    entity: media_player.kitchen_s_echo
                    name: Kitchen Echo
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                      - play_pause_stop
                    fill_container: true
                  - type: custom:mushroom-media-player-card
                    entity: media_player.living_room_2
                    name: Yamaha Main
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
