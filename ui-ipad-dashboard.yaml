##############################################################
# iPad Landscape Dashboard — ui-ipad-dashboard.yaml
# v3
#
# HOW TO REGISTER:
#   Settings → Dashboards → Add Dashboard
#   Title: iPad  |  Icon: mdi:tablet  |  URL: /ui-ipad
#   Mode: YAML  →  point to this file path
#
# ── REQUIRED HACS FRONTEND CARDS (all pre-installed) ──────
#  ✓ lovelace-mushroom        (Mushroom Cards v5+)
#  ✓ lovelace-card-mod        (CSS overrides)
#  ✓ lovelace-layout-card     (Grid Layout engine)
#  ✓ browser_mod              (Smart popups v2+)
#  ✓ clock-weather-card       (Sidebar clock + weather)
#
# ── TEMP SENSOR FUTURE-PROOFING ───────────────────────────
#  Room summaries and tabs show AC current_temperature as fallback.
#  When dedicated sensors are added (e.g. sensor.bedroom_temperature),
#  replace the state_attr call with the sensor state in the template:
#    Currently:  state_attr('climate.l8_105', 'current_temperature')
#    Replace with: states('sensor.bedroom_temperature')
#
# ── THEME ──────────────────────────────────────────────────
#  "Frosted Glass Dark" — installed in themes/
##############################################################

title: iPad

views:

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                         HOME                                 ║
  # ║  Main page = Common Areas (Living, Kitchen, Entrance,        ║
  # ║  Hallway, Balcony) + compact chips for other rooms           ║
  # ╚══════════════════════════════════════════════════════════════╝
  - title: Home
    path: home
    theme: "Frosted Glass Dark"
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: "280px minmax(0, 1fr)"
          grid-template-areas: |
            "sidebar main"
          grid-gap: "10px"
          padding: "10px"

        cards:

          # ╔═══════════════════════════════╗
          # ║           SIDEBAR             ║
          # ╚═══════════════════════════════╝
          - view_layout:
              grid-area: sidebar
            type: vertical-stack
            cards:

              # ── Clock + Weather ──────────────────
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                time_format: 24
                animated_icon: true
                forecast_rows: 3

              # ── Presence ─────────────────────────
              - type: custom:mushroom-title-card
                title: Presence
                card_mod:
                  style: |
                    ha-card { margin-top: 4px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-person-card
                    entity: person.shachar
                    name: Shachar
                    layout: vertical
                    fill_container: true
                  - type: custom:mushroom-person-card
                    entity: person.ariel
                    name: Ariel
                    layout: vertical
                    fill_container: true

              # ── Routines ─────────────────────────
              - type: custom:mushroom-title-card
                title: Routines
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Good Night
                    secondary: Routine
                    icon: mdi:weather-night
                    icon_color: indigo
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_night_event
                  - type: custom:mushroom-template-card
                    primary: Good Morning
                    secondary: Routine
                    icon: mdi:weather-sunny
                    icon_color: amber
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_morning_event

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Exit Home
                    secondary: Away
                    icon: mdi:exit-run
                    icon_color: orange
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.exit_home_event
                  - type: custom:mushroom-template-card
                    primary: Welcome Home
                    secondary: Arrival
                    icon: mdi:home-import-outline
                    icon_color: green
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.welcome_home_event_trigger

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Lights Off
                    secondary: All
                    icon: mdi:lightbulb-off-outline
                    icon_color: yellow
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.turn_off_all_lights_v2
                  - type: custom:mushroom-template-card
                    primary: Close Blinds
                    secondary: All
                    icon: mdi:blinds
                    icon_color: blue
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.close_all_blinds

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: ACs Off
                    secondary: All Units
                    icon: mdi:air-conditioner
                    icon_color: blue-grey
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.1766497466499
                  - type: custom:mushroom-template-card
                    entity: cover.4g600204913
                    primary: Garage Gate
                    secondary: >
                      {{ 'Open' if is_state('cover.4g600204913', 'open') else 'Closed' }}
                    icon: mdi:garage
                    icon_color: >
                      {{ 'green' if is_state('cover.4g600204913', 'open') else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: more-info

              # ── Food Time + Movie Time ─────────────
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Food Time
                    secondary: Kitchen lights
                    icon: mdi:silverware-fork-knife
                    icon_color: deep-orange
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.food_time_routine

                  - type: custom:mushroom-template-card
                    primary: Movie Time
                    secondary: Lights + Blinds?
                    icon: mdi:movie-play
                    icon_color: purple
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.popup
                        data:
                          title: Movie Time
                          size: normal
                          content:
                            type: vertical-stack
                            cards:
                              - type: custom:mushroom-template-card
                                primary: Lights will be turned off
                                secondary: Living Room, Kitchen & Office. Close blinds too?
                                icon: mdi:movie-play-outline
                                icon_color: purple
                                layout: horizontal
                                fill_container: true
                              - type: horizontal-stack
                                cards:
                                  - type: custom:mushroom-template-card
                                    primary: Lights Only
                                    icon: mdi:lightbulb-off-outline
                                    icon_color: yellow
                                    layout: vertical
                                    fill_container: true
                                    tap_action:
                                      action: call-service
                                      service: script.turn_on
                                      service_data:
                                        entity_id: script.movie_time_lights_only
                                  - type: custom:mushroom-template-card
                                    primary: Lights + Blinds
                                    icon: mdi:blinds
                                    icon_color: blue
                                    layout: vertical
                                    fill_container: true
                                    tap_action:
                                      action: call-service
                                      service: script.turn_on
                                      service_data:
                                        entity_id: script.movie_time_lights_and_blinds

              # ── Good Night Mode State ─────────────
              - type: custom:mushroom-entity-card
                entity: input_boolean.good_night_state
                name: Good Night Mode
                icon: mdi:sleep
                icon_color: indigo
                tap_action:
                  action: toggle
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # ── Git Sync (single button → popup) ──
              # Pull/Push run shell commands; wired with call-service so they execute reliably.
              - type: custom:mushroom-template-card
                primary: >
                  {% set s = states('sensor.git_setup_status') %}
                  {% if s == 'git_not_found' %}Git not found
                  {% elif s == 'not_a_repo' %}Not a repo
                  {% elif s.startswith('ok:') %}Branch: {{ s[3:] | trim }}
                  {% else %}{{ s }}
                  {% endif %}
                secondary: Git Sync — tap to manage
                icon: >
                  {% set s = states('sensor.git_setup_status') %}
                  {% if s.startswith('ok:') %}mdi:source-branch-check
                  {% else %}mdi:alert-circle-outline
                  {% endif %}
                icon_color: >
                  {% set s = states('sensor.git_setup_status') %}
                  {% if s.startswith('ok:') %}green{% else %}red{% endif %}
                layout: horizontal
                fill_container: true
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Git Sync
                      size: normal
                      content:
                        type: vertical-stack
                        cards:
                          - type: custom:mushroom-template-card
                            primary: >
                              {% set s = states('sensor.git_setup_status') %}
                              {% if s.startswith('ok:') %}{{ s[3:] | trim }}{% else %}{{ s }}{% endif %}
                            secondary: Current branch
                            icon: >
                              {% set s = states('sensor.git_setup_status') %}
                              {% if s.startswith('ok:') %}mdi:source-branch-check{% else %}mdi:alert-circle-outline{% endif %}
                            icon_color: >
                              {% set s = states('sensor.git_setup_status') %}
                              {% if s.startswith('ok:') %}green{% else %}red{% endif %}
                            layout: horizontal
                            fill_container: true
                          - type: horizontal-stack
                            cards:
                              - type: custom:mushroom-template-card
                                primary: Pull
                                secondary: Check & pull
                                icon: mdi:cloud-download-outline
                                icon_color: blue
                                layout: vertical
                                fill_container: true
                                tap_action:
                                  action: call-service
                                  service: shell_command.ha_pull_config
                              - type: custom:mushroom-template-card
                                primary: Push
                                secondary: Commit & push
                                icon: mdi:cloud-upload-outline
                                icon_color: green
                                layout: vertical
                                fill_container: true
                                tap_action:
                                  action: call-service
                                  service: shell_command.ha_push_config

              # ── Apps ──────────────────────────────
              - type: custom:mushroom-title-card
                title: Apps
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: custom:mushroom-template-card
                primary: Baby Monitor
                secondary: Philips Avent
                icon: mdi:baby-face-outline
                icon_color: pink
                layout: vertical
                fill_container: true
                tap_action:
                  action: url
                  url_path: "shortcuts://x-callback-url/run-shortcut?name=Baby%20Monitor"


          # ╔═══════════════════════════════╗
          # ║          MAIN AREA            ║
          # ╚═══════════════════════════════╝
          - view_layout:
              grid-area: main
            type: vertical-stack
            cards:

              # ── UPDATE BANNER ──────────────────────
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.config_update_available
                    state: 'on'
                card:
                  type: custom:mushroom-template-card
                  primary: Config Update Available
                  secondary: Check iPad notification to approve restart · Hold to dismiss
                  icon: mdi:update
                  icon_color: amber
                  fill_container: true
                  tap_action:
                    action: perform-action
                    perform_action: homeassistant.restart
                  hold_action:
                    action: perform-action
                    perform_action: shell_command.clear_update_flag
                  card_mod:
                    style: |
                      ha-card {
                        border: 1px solid rgba(255,180,0,0.6) !important;
                        background: rgba(255,180,0,0.12) !important;
                        margin-bottom: 6px !important;
                      }

              # ── STATUS BAR ────────────────────────
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}Red Alert!{% elif s == 'pre_alert' %}Pre-Alert{% else %}Area Secure{% endif %}
                    secondary: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}Seek shelter{% elif s == 'pre_alert' %}Be ready{% else %}No alerts{% endif %}
                    icon: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s in ['alert','pre_alert'] %}mdi:alert-circle{% else %}mdi:shield-check{% endif %}
                    icon_color: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}red{% elif s == 'pre_alert' %}orange{% else %}green{% endif %}
                    fill_container: true
                    tap_action:
                      action: more-info
                      entity: sensor.oref_alert

                  - type: custom:mushroom-entity-card
                    entity: input_boolean.is_away_state
                    name: Away Mode
                    icon: mdi:home-lock
                    tap_action:
                      action: toggle
                    fill_container: true

                  - type: custom:mushroom-number-card
                    entity: number.mqlkht_dvd_countdown
                    name: Boiler Timer
                    icon: mdi:water-boiler
                    icon_color: deep-orange
                    display_mode: slider
                    fill_container: true

              # ── ROOM NAVIGATION CHIPS ─────────────
              # Compact chips for rooms not shown below — tap to navigate
              - type: custom:mushroom-title-card
                title: Other Rooms
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  # Office chip
                  # Future: replace state_attr temp with states('sensor.office_temperature')
                  - type: custom:mushroom-template-card
                    primary: Office
                    secondary: >
                      {% set ac = states('climate.l8_103') %}
                      {% set lon = [states('light.mshrd_mshrd_tqrh'), states('light.mshrd_mshrd_qyr_khlvn'), states('light.mshrd_mshrd_qyr')] | select('eq','on') | list | count %}
                      {% set temp = state_attr('climate.l8_103', 'current_temperature') %}
                      {{ 'AC · ' if ac != 'off' else '' }}{{ lon }} light{{ 's' if lon != 1 }}{% if temp %} · {{ temp }}°{% endif %}
                    icon: mdi:desk
                    icon_color: >
                      {% set ac = states('climate.l8_103') %}
                      {% set lon = [states('light.mshrd_mshrd_tqrh'), states('light.mshrd_mshrd_qyr_khlvn'), states('light.mshrd_mshrd_qyr')] | select('eq','on') | list | count %}
                      {{ 'blue' if ac != 'off' or lon > 0 else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/office

                  # Kids chip
                  # Future: replace state_attr temp with states('sensor.kids_temperature')
                  - type: custom:mushroom-template-card
                    primary: Kids
                    secondary: >
                      {% set ac = states('climate.l8_104') %}
                      {% set lon = [states('light.mm_d_mm_d_tqrh'), states('light.mqlkht_mqlkht_qyr'), states('light.mqlkht_mqlkht_tvrt_lylh'), states('light.mqlkht_mqlkht_spvtym')] | select('eq','on') | list | count %}
                      {% set temp = state_attr('climate.l8_104', 'current_temperature') %}
                      {{ 'AC · ' if ac != 'off' else '' }}{{ lon }} light{{ 's' if lon != 1 }}{% if temp %} · {{ temp }}°{% endif %}
                    icon: mdi:bed-double
                    icon_color: >
                      {% set ac = states('climate.l8_104') %}
                      {% set lon = [states('light.mm_d_mm_d_tqrh'), states('light.mqlkht_mqlkht_qyr'), states('light.mqlkht_mqlkht_tvrt_lylh'), states('light.mqlkht_mqlkht_spvtym')] | select('eq','on') | list | count %}
                      {{ 'purple' if ac != 'off' or lon > 0 else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/kids

                  # Bedroom chip
                  # Future: replace state_attr temp with states('sensor.bedroom_temperature')
                  - type: custom:mushroom-template-card
                    primary: Bedroom
                    secondary: >
                      {% set ac = states('climate.l8_105') %}
                      {% set lon = [states('light.hvrym_hvrym_spvtym'), states('light.hvrym_hvrym_knysh'), states('light.hvrym_hvrym_qryh_ymyn'), states('light.hvrym_hvrym_qryh_shml'), states('light.hvrym_hvrym_mqlkht_qyr_2'), states('light.hvrym_hvrym_mqlkht_qyr_1'), states('light.hvrym_hvrym_mqlkht_spvtym')] | select('eq','on') | list | count %}
                      {% set temp = state_attr('climate.l8_105', 'current_temperature') %}
                      {{ 'AC · ' if ac != 'off' else '' }}{{ lon }} light{{ 's' if lon != 1 }}{% if temp %} · {{ temp }}°{% endif %}
                    icon: mdi:bed-king
                    icon_color: >
                      {% set ac = states('climate.l8_105') %}
                      {% set lon = [states('light.hvrym_hvrym_spvtym'), states('light.hvrym_hvrym_knysh'), states('light.hvrym_hvrym_qryh_ymyn'), states('light.hvrym_hvrym_qryh_shml'), states('light.hvrym_hvrym_mqlkht_qyr_2'), states('light.hvrym_hvrym_mqlkht_qyr_1'), states('light.hvrym_hvrym_mqlkht_spvtym')] | select('eq','on') | list | count %}
                      {{ 'indigo' if ac != 'off' or lon > 0 else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: navigate
                      navigation_path: /ui-ipad/bedroom

              # ══════════════════════════════════════
              # LIVING ROOM
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Living Room
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.slvn_slvn_spvtym
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.slvn_slvn_qyr
                    fill_container: true
                    tap_action:
                      action: toggle
                  # Fan: direct toggle via service call — no dialog
                  - type: custom:mushroom-template-card
                    primary: >
                      {{ 'Fan On' if is_state('fan.slvn_slvn_tqrh', 'on') else 'Fan Off' }}
                    secondary: Living Room
                    icon: >
                      {{ 'mdi:fan' if is_state('fan.slvn_slvn_tqrh', 'on') else 'mdi:fan-off' }}
                    icon_color: >
                      {{ 'cyan' if is_state('fan.slvn_slvn_tqrh', 'on') else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: fan.toggle
                      target:
                        entity_id: fan.slvn_slvn_tqrh

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-cover-card
                    entity: cover.slvn_slvn_trys
                    name: Living Room
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info
                  - type: custom:mushroom-cover-card
                    entity: cover.slvn_slvn_trys_khlvn
                    name: Small Blind
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

              # ══════════════════════════════════════
              # KITCHEN
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Kitchen
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_ps
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_qyr
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_shvlkhn
                    fill_container: true
                    tap_action:
                      action: toggle

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.knysh_na
                    fill_container: true
                    tap_action:
                      action: toggle
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_y
                    fill_container: true
                    tap_action:
                      action: toggle

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-climate-card
                    entity: climate.l8_101
                    name: Kitchen 1
                    hvac_modes:
                      - "off"
                      - cool
                      - heat
                      - fan_only
                      - dry
                    show_temperature_control: true
                    fill_container: true
                  - type: custom:mushroom-climate-card
                    entity: climate.l8_102
                    name: Kitchen 2
                    hvac_modes:
                      - "off"
                      - cool
                      - heat
                      - fan_only
                      - dry
                    show_temperature_control: true
                    fill_container: true

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-cover-card
                    entity: cover.mtbkh_mtbkh_trys
                    name: Kitchen
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

              # ══════════════════════════════════════
              # MEDIA (Kitchen + Living Room)
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Media
                subtitle: Alexa · Yamaha · TV
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-media-player-card
                    entity: media_player.kitchen_s_echo
                    name: Kitchen Echo
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                      - play_pause_stop
                    fill_container: true
                  - type: custom:mushroom-template-card
                    primary: Play Everywhere
                    secondary: Music Assistant
                    icon: mdi:music-note-plus
                    icon_color: purple
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.play_music_everywhere

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-media-player-card
                    entity: media_player.living_room_2
                    name: Yamaha Main
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                    fill_container: true
                  - type: custom:mushroom-media-player-card
                    entity: media_player.living_room_zone2
                    name: Yamaha Kitchen
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                    fill_container: true

              # TV card — tap to open full remote popup
              - type: custom:mushroom-media-player-card
                entity: media_player.tv_2
                name: Samsung TV
                use_media_info: true
                volume_controls:
                  - volume_set
                  - volume_mute
                media_controls:
                  - on_off
                  - play_pause_stop
                  - previous
                  - next
                fill_container: true
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      title: Samsung TV Controls
                      size: fullscreen
                      content:
                        type: vertical-stack
                        cards:
                          - type: custom:mushroom-media-player-card
                            entity: media_player.tv_2
                            name: Samsung TV
                            use_media_info: true
                            volume_controls:
                              - volume_set
                              - volume_mute
                            media_controls:
                              - on_off
                              - play_pause_stop
                              - previous
                              - next
                            fill_container: true
                          - type: horizontal-stack
                            cards:
                              - type: vertical-stack
                                cards:
