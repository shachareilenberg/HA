##############################################################
# iPad Landscape Dashboard — ui-ipad-dashboard.yaml
# v2
#
# HOW TO REGISTER:
#   Settings → Dashboards → Add Dashboard
#   Title: iPad Home  |  Icon: mdi:tablet  |  URL: /ui-ipad
#   Mode: YAML  →  point to this file path
#
# ── REQUIRED HACS FRONTEND CARDS (all pre-installed) ──────
#  ✓ lovelace-mushroom        (Mushroom Cards v5+)
#  ✓ lovelace-card-mod        (CSS overrides)
#  ✓ lovelace-layout-card     (Grid Layout engine)
#  ✓ browser_mod              (Smart popups v2+)
#  ✓ clock-weather-card       (Sidebar clock + weather)
#
# ── SAMSUNG TV NOTE ────────────────────────────────────────
#  In the Entertainment section, replace media_player.samsung_tv
#  with your actual entity ID:
#    Settings → Devices & Services → Samsung Smart TV → entity
#  For full remote control (arrows, home, back, app launcher):
#    Install "SamsungTV Smart" from HACS.
#
# ── THEME ──────────────────────────────────────────────────
#  "Frosted Glass Dark" — installed in themes/
#  Provides automatic glassmorphism on all ha-card elements
##############################################################

title: iPad Home

views:
  - title: Home
    path: home
    theme: "Frosted Glass Dark"
    panel: true
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: "280px minmax(0, 1fr)"
          grid-template-areas: |
            "sidebar main"
          grid-gap: "10px"
          padding: "10px"

        cards:

          # ╔═══════════════════════════════╗
          # ║           SIDEBAR             ║
          # ╚═══════════════════════════════╝
          - view_layout:
              grid-area: sidebar
            type: vertical-stack
            cards:

              # ── Clock + Weather ──────────────────
              # If weather.forecast_home shows an error, try weather.home
              - type: custom:clock-weather-card
                entity: weather.forecast_home
                time_format: 24
                animated_icon: true
                forecast_rows: 3

              # ── Presence ─────────────────────────
              - type: custom:mushroom-title-card
                title: Presence
                card_mod:
                  style: |
                    ha-card { margin-top: 4px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-person-card
                    entity: person.shachar
                    name: Shachar
                    layout: vertical
                    fill_container: true
                  - type: custom:mushroom-person-card
                    entity: person.ariel
                    name: Ariel
                    layout: vertical
                    fill_container: true

              # ── Routines ─────────────────────────
              - type: custom:mushroom-title-card
                title: Routines
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Good Night
                    secondary: Routine
                    icon: mdi:weather-night
                    icon_color: indigo
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_night_event
                  - type: custom:mushroom-template-card
                    primary: Good Morning
                    secondary: Routine
                    icon: mdi:weather-sunny
                    icon_color: amber
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_morning_event

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Exit Home
                    secondary: Away
                    icon: mdi:exit-run
                    icon_color: orange
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.exit_home_event
                  - type: custom:mushroom-template-card
                    primary: Welcome Home
                    secondary: Arrival
                    icon: mdi:home-import-outline
                    icon_color: green
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.welcome_home_event_trigger

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Lights Off
                    secondary: All
                    icon: mdi:lightbulb-off-outline
                    icon_color: yellow
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.turn_off_all_lights_v2
                  - type: custom:mushroom-template-card
                    primary: Close Blinds
                    secondary: All
                    icon: mdi:blinds
                    icon_color: blue
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.close_all_blinds

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: ACs Off
                    secondary: All Units
                    icon: mdi:air-conditioner
                    icon_color: blue-grey
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.1766497466499
                  - type: custom:mushroom-template-card
                    entity: cover.4g600204913
                    primary: Garage Gate
                    secondary: >
                      {{ 'Open' if is_state('cover.4g600204913', 'open') else 'Closed' }}
                    icon: mdi:garage
                    icon_color: >
                      {{ 'green' if is_state('cover.4g600204913', 'open') else 'grey' }}
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: more-info

              # ── Good Night Mode State ─────────────
              - type: custom:mushroom-entity-card
                entity: input_boolean.good_night_state
                name: Good Night Mode
                icon: mdi:sleep
                icon_color: indigo
                toggle: true
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }


          # ╔═══════════════════════════════╗
          # ║          MAIN AREA            ║
          # ╚═══════════════════════════════╝
          - view_layout:
              grid-area: main
            type: vertical-stack
            cards:

              # ── STATUS BAR ────────────────────────
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}Red Alert Active!{% elif s == 'pre_alert' %}Pre-Alert Warning{% else %}Area Secure{% endif %}
                    secondary: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}Seek shelter now{% elif s == 'pre_alert' %}Prepare for alert{% else %}No active alerts{% endif %}
                    icon: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s in ['alert', 'pre_alert'] %}mdi:alert-circle{% else %}mdi:shield-check{% endif %}
                    icon_color: >
                      {% set s = states('sensor.oref_alert') %}
                      {% if s == 'alert' %}red{% elif s == 'pre_alert' %}orange{% else %}green{% endif %}
                    fill_container: true
                    tap_action:
                      action: more-info
                      entity: sensor.oref_alert

                  - type: custom:mushroom-entity-card
                    entity: input_boolean.is_away_state
                    name: Away Mode
                    icon: mdi:home-lock
                    toggle: true
                    fill_container: true

                  - type: custom:mushroom-number-card
                    entity: number.mqlkht_dvd_countdown
                    name: Boiler Timer
                    icon: mdi:water-boiler
                    icon_color: deep-orange
                    display_mode: slider
                    fill_container: true


              # ══════════════════════════════════════
              # CLIMATE
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Climate
                subtitle: Air Conditioning
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # Row 1: Kitchen 1 | Kitchen 2 | Office
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-climate-card
                    entity: climate.l8_101
                    name: Kitchen 1
                    fill_container: true
                    tap_action:
                      action: more-info

                  - type: custom:mushroom-climate-card
                    entity: climate.l8_102
                    name: Kitchen 2
                    fill_container: true
                    tap_action:
                      action: more-info

                  - type: custom:mushroom-climate-card
                    entity: climate.l8_103
                    name: Office
                    fill_container: true
                    tap_action:
                      action: more-info

              # Row 2: Kids Bathroom | Bedroom
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-climate-card
                    entity: climate.l8_104
                    name: Kids Bathroom
                    fill_container: true
                    tap_action:
                      action: more-info

                  - type: custom:mushroom-climate-card
                    entity: climate.l8_105
                    name: Bedroom
                    fill_container: true
                    tap_action:
                      action: more-info


              # ══════════════════════════════════════
              # LIGHTING
              # ══════════════════════════════════════
              # Names come from HA friendly names — no overrides here.
              # Tap to toggle on/off.
              - type: custom:mushroom-title-card
                title: Lighting
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # Row: Kitchen + Entrance
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_y
                    fill_container: true
                    tap_action:
                      action: toggle

                  - type: custom:mushroom-light-card
                    entity: light.mtbkh_mtbkh_ps
                    fill_container: true
                    tap_action:
                      action: toggle

                  - type: custom:mushroom-light-card
                    entity: light.knysh_knysh_qyr
                    fill_container: true
                    tap_action:
                      action: toggle

              # Row: Entrance + Shower
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.knysh_knysh_tvrh
                    fill_container: true
                    tap_action:
                      action: toggle

                  - type: custom:mushroom-light-card
                    entity: light.mqlkht_mqlkht_qyr
                    fill_container: true
                    tap_action:
                      action: toggle

                  - type: custom:mushroom-light-card
                    entity: light.mqlkht_mqlkht_tvrt_lylh
                    fill_container: true
                    tap_action:
                      action: toggle

              # Row: Hallway + Safe Room + Shower Heater
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-light-card
                    entity: light.msdrvn_msdrvn_tvrt_lylh
                    fill_container: true
                    tap_action:
                      action: toggle

                  - type: custom:mushroom-light-card
                    entity: light.mm_d_mm_d_tqrh
                    fill_container: true
                    tap_action:
                      action: toggle

                  - type: custom:mushroom-entity-card
                    entity: switch.mqlkht_mqlkht_tnvr
                    icon: mdi:radiator
                    icon_color: deep-orange
                    toggle: true
                    fill_container: true


              # ══════════════════════════════════════
              # BLINDS
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Blinds
                subtitle: Position Control
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # Row: Living Room + Kitchen
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-cover-card
                    entity: cover.slvn_slvn_trys
                    name: Living Room
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

                  - type: custom:mushroom-cover-card
                    entity: cover.slvn_slvn_trys_khlvn
                    name: Living Window
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

                  - type: custom:mushroom-cover-card
                    entity: cover.mtbkh_mtbkh_trys
                    name: Kitchen
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

              # Row: Office + Bedroom
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-cover-card
                    entity: cover.knysh_n4_1
                    name: Office
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info

                  - type: custom:mushroom-cover-card
                    entity: cover.hvrym_hvrym_trys
                    name: Bedroom
                    show_position_control: true
                    show_buttons_control: true
                    fill_container: true
                    tap_action:
                      action: more-info


              # ══════════════════════════════════════
              # MEDIA
              # ══════════════════════════════════════
              - type: custom:mushroom-title-card
                title: Media
                subtitle: Alexa & Music
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              # Row: Alexa Echoes + Play Everywhere
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-media-player-card
                    entity: media_player.kitchen_s_echo
                    name: Kitchen Echo
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                      - play_pause_stop
                    fill_container: true

                  - type: custom:mushroom-media-player-card
                    entity: media_player.bedroom_echo_spot
                    name: Bedroom Echo
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                      - play_pause_stop
                    fill_container: true

                  - type: custom:mushroom-template-card
                    primary: Play Everywhere
                    secondary: Music Assistant
                    icon: mdi:music-note-plus
                    icon_color: purple
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.play_music_everywhere

              # Row: Delayed Good Night
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-template-card
                    primary: Delayed Night
                    secondary: Good Night in 25 min
                    icon: mdi:timer-outline
                    icon_color: blue-grey
                    layout: vertical
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: script.turn_on
                      service_data:
                        entity_id: script.good_night_event_25m_delayed


              # ══════════════════════════════════════
              # ENTERTAINMENT
              # ══════════════════════════════════════
              # !! Replace media_player.samsung_tv with your actual entity ID !!
              # Find it: Settings → Devices & Services → Samsung Smart TV → entity
              # Source name for Yamaha: check state_attr('media_player.samsung_tv','source_list')
              #   in Developer Tools → Template to see all available sources.
              - type: custom:mushroom-title-card
                title: Entertainment
                subtitle: Samsung TV
                card_mod:
                  style: |
                    ha-card { margin-top: 8px !important; }

              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-media-player-card
                    entity: media_player.samsung_tv
                    name: Samsung TV
                    volume_controls:
                      - volume_set
                      - volume_mute
                    media_controls:
                      - on_off
                      - play_pause_stop
                      - previous
                      - next
                    fill_container: true
